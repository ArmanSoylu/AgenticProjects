name: build-image

# İmajı GitHub'ın runner'ında derleyip GHCR'a basar.
# Kendi bilgisayarında Docker'ın çalışmasına ya da bir Personal Access Token
# üretmene gerek yok: aşağıdaki GITHUB_TOKEN her çalıştırmada otomatik üretilir.

on:
  push:
    branches: [master, master-gemini-arch, master-gemini-arch-completed]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/armansoylu/dreamer-api

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Önce yerele derle ve içeri girip gerçekten açılıyor mu diye bak.
      # "Derlendi" ile "çalışıyor" aynı şey değil: sabitlenmemiş bir bağımlılık
      # yüzünden imaj sorunsuz derlenip konteyner açılışta ölebiliyor.
      - name: Derle (yerel)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Duman testi — uygulama import ediliyor mu
        run: |
          docker run --rm ${{ env.IMAGE }}:test \
            python -c "import server; print('server.py import edildi, rotalar:', len(server.app.routes))"

      # Test geçtiyse aynı katmanları cache'ten alıp push eder.
      - name: GHCR'a push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
