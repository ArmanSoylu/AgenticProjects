name: build-image

# İmajı GitHub'ın runner'ında derleyip GHCR'a basar.
# Kendi bilgisayarında Docker'ın çalışmasına ya da bir Personal Access Token
# üretmene gerek yok: aşağıdaki GITHUB_TOKEN her çalıştırmada otomatik üretilir.

on:
  push:
    branches: [master, master-gemini-arch, master-gemini-arch-completed]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR sadece küçük harf kabul ediyor, kullanıcı adı ArmanSoylu olduğu
      # için depo adından türetmek yerine sabit yazıyoruz.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/armansoylu/dreamer-api:latest
            ghcr.io/armansoylu/dreamer-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
